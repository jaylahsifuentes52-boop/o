<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TvRemover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="mark">TV</div>
        <div>
          <h1>TvRemover</h1>
          <p class="sub">Strip listed anticheat names from data.unity3d</p>
        </div>
      </div>
    </header>

    <section class="card" id="dropzone">
      <input id="fileInput" type="file" accept=".unity3d,application/octet-stream" hidden />
      <div class="dz-icon">⬆</div>
      <h2>Drop data.unity3d here</h2>
      <p>or</p>
      <button type="button" class="btn ghost" id="browseBtn">Browse files</button>
      <p class="file-meta" id="fileMeta">No file selected</p>
    </section>

    <div class="actions">
      <button type="button" class="btn primary" id="processBtn" disabled>Remove Anticheats</button>
      <button type="button" class="btn" id="downloadBtn" disabled>Save data_noantis.zip</button>
    </div>

    <div class="progress"><div class="fill" id="progressFill"></div></div>
    <p class="status" id="status">Waiting for a file…</p>

    <section class="card slim">
      <h3>Hits</h3>
      <div id="results" class="results empty-hint">Nothing processed yet.</div>
    </section>

    <section class="card slim">
      <h3>Log</h3>
      <div id="log" class="log"></div>
    </section>

    <footer>
      Every name from your list is scanned. Matches are overwritten in-place with
      underscores so file size and offsets stay the same.
    </footer>
  </div>
  <script src="signatures.js"></script>
  <script src="app.js"></script>
</body>
</html>
